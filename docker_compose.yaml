
# Elarion -- docker-compose for the two live application servers.
#
# What changed vs. before (see production readiness review, items 5.12 / 5.13):
#   - Before: this file was completely empty -- there was no repeatable,
#     one-command way to run the app servers, and nothing auto-restarted
#     them if they crashed.
#   - Now: whatsapp_server.py and vapi_server.py are defined as services,
#     each with `restart: unless-stopped` (auto-recovers from a crash) and
#     a healthcheck against their existing `/health` endpoint.
#
# What's intentionally NOT here:
#   - A Postgres service. This project does not run a local Postgres --
#     DATABASE_URL in langgraph_agent/.env already points at a managed,
#     SSL-enforced cloud Postgres (Neon). So the "weak default DB password
#     in docker_compose.yaml" issue described in item 5.11 of the review
#     does not actually apply to this codebase as it stands: there is no
#     local DB container, and therefore no hardcoded "postgres/password"
#     to fix. If you ever DO add a local Postgres service here, pull the
#     password from `${POSTGRES_PASSWORD}` (set in .env) -- never hardcode it.
#   - mcp_server.py as its own service. It isn't a standalone network
#     server -- each app process spawns it itself as a stdio subprocess
#     (see app/orchestrator/maintenance/mcp_client.py connect()), so it
#     lives inside the whatsapp/vapi containers, not beside them.
#   - A Dockerfile / prebuilt image. None existed in this project, and per
#     your instructions I'm not introducing new files outside what the
#     review named -- so these services build nothing and instead run
#     directly off your existing source tree via a stock python image and a
#     `command:`, installing dependencies on container start.
#     For a real production image, you'll eventually want a proper
#     Dockerfile with dependencies baked in at build time rather than
#     installed on every container start -- faster startup, reproducible
#     builds. Happy to add one when you're ready; didn't want to add files
#     you didn't ask for yet.

services:
  whatsapp-server:
    image: python:3.11-slim
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8003:8003"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python whatsapp_server.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vapi-server:
    image: python:3.11-slim
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8002:8002"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python vapi_server.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
