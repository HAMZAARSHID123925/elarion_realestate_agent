version: '3.8'

# Elarion -- docker-compose for live application servers.
#
# Services defined:
#   - whatsapp-server: WhatsApp webhook listener & LangGraph channel integration (Port 8003)
#   - vapi-server: Vapi voice assistant integration server (Port 8002)
#
# Each service includes automatic crash recovery (restart: unless-stopped)
# and periodic container healthchecks.

services:
  whatsapp-server:
    image: python:3.11-slim
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8003:8003"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python whatsapp_server.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vapi-server:
    image: python:3.11-slim
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8002:8002"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python vapi_server.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
