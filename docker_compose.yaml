version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: realestate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: python:3.11-slim
    container_name: elarion_core_api
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./database:/srv/database
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8080:8080"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python -m app.server"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    image: python:3.11-slim
    container_name: elarion_scheduler_daemon
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./database:/srv/database
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python -m app.jobs.scheduler"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  whatsapp-server:
    image: python:3.11-slim
    container_name: elarion_whatsapp_channel
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./database:/srv/database
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python whatsapp_server.py"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  vapi-server:
    image: python:3.11-slim
    container_name: elarion_vapi_channel
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./database:/srv/database
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8001:8001"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python vapi_server.py"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  email-server:
    image: python:3.11-slim
    container_name: elarion_email_channel
    working_dir: /srv/langgraph_agent
    volumes:
      - ./langgraph_agent:/srv/langgraph_agent
      - ./database:/srv/database
      - ./mcp_servers:/srv/mcp_servers
    env_file:
      - ./langgraph_agent/.env
    ports:
      - "8002:8002"
    command: >
      bash -c "pip install --no-cache-dir --break-system-packages
        fastapi uvicorn requests python-dotenv psycopg[binary] psycopg_pool
        mcp langgraph langchain-core langchain-groq pydantic
        -r requirements-faq.txt
        && python email_server.py"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
